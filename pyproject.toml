[project]
name = "deepagents-market-intel"
version = "1.0.0"
description = "A multi-agent competitive intelligence researcher with a fact-checking critic loop"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Pinned EXACTLY, not >=. Defaults change between minor versions in ways that
    # fail silently -- see the "Version pinning" section of the README.
    "deepagents==0.4.11",
    "langchain>=1.3.14",
    "langgraph>=1.0.0",
    "langchain-anthropic>=1.5.3",
    "langchain-openai>=1.0.0",
    "langchain-tavily>=0.2.0",   # web search backend
    "python-dotenv>=1.0.1",
    "streamlit>=1.40.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
]

[tool.uv]
# An application (app + notebooks), not an installable library.
package = false
